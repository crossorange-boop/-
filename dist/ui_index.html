/** F. 成果物・承認管理（承認待ち・成果物一覧・処理済み） */
(function () {
  var esc = App.esc;
  var REVIEW_LABEL = { PENDING: '確認待ち', APPROVED: '承認', REJECTED: '差し戻し' };
  var APPROVAL_LABEL = { PENDING: '承認待ち', APPROVED: '承認済み', REJECTED: '差し戻し', CANCELLED: '取消' };

  function tabs(active, pendingCount, reviewCount) {
    var t = [['pending', '承認待ち', pendingCount], ['deliverables', '成果物', reviewCount], ['history', '承認履歴', 0]];
    return '<nav class="tabs">' + t.map(function (x) {
      return '<a href="#/approvals?tab=' + x[0] + '" class="' + (active === x[0] ? 'active' : '') + '">' + esc(x[1]) +
        (x[2] ? ' <span class="badge num" style="height:18px;min-width:18px;font-size:10.5px">' + x[2] + '</span>' : '') + '</a>';
    }).join('') + '</nav>';
  }

  function decide(kind, id, decision, name) {
    var approve = decision === 'APPROVED';
    App.confirmDialog(approve ? '承認' : '差し戻し', '「' + name + '」を' + (approve ? '承認' : '差し戻し') + 'します。',
      { reason: true, reasonRequired: !approve, reasonLabel: approve ? 'コメント（任意）' : '差し戻し理由（必須）', submitLabel: approve ? '承認する' : '差し戻す', danger: !approve,
        action: function (d) {
          if (kind === 'deliverable') return App.call('deliverables.review', { deliverable_id: id, decision: decision, comment: d.reason });
          return App.call(approve ? 'approvals.approve' : 'approvals.reject', { approval_id: id, comment: d.reason });
        } })
      .then(function () { App.toast(approve ? '承認しました' : '差し戻しました'); App.render(); });
  }

  function approvalItem(a, withButtons) {
    var target = a.task_name ? '<a href="#/tasks?id=' + encodeURIComponent(a.task_id) + '">' + esc(a.task_name) + '</a>' : esc(a.target_id || '');
    var payload = {};
    try { payload = a.payload_json ? JSON.parse(a.payload_json) : {}; } catch (e) { payload = {}; }
    var title = a.action_label + '：' + (a.task_name || payload.project_name || payload.task_name || a.target_id || '');
    return '<li><div class="grow"><div class="title">' + esc(title) + '</div>' +
      '<div class="meta">' + (a.task_name ? '対象タスク：' + target + ' ・ ' : '') + '依頼 ' + App.fmtDate(a.requested_at, true) +
      (a.approver ? ' ・ ' + esc(a.approver.split('@')[0]) + ' が ' + App.fmtDate(a.approved_at, true) + ' に処理' : '') + '</div>' +
      (a.comment ? '<div class="meta" style="white-space:pre-wrap">' + esc(a.comment) + '</div>' : '') + '</div>' +
      (withButtons && App.isOwner()
        ? '<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="btn primary" data-approve="' + esc(a.approval_id) + '" data-name="' + esc(title) + '">承認</button>' +
          '<button class="btn danger" data-reject="' + esc(a.approval_id) + '" data-name="' + esc(title) + '">差し戻し</button></div>'
        : '<span class="chip ' + (a.approval_status === 'APPROVED' ? 'good' : a.approval_status === 'REJECTED' ? 'critical' : 'warn') + '">' + esc(APPROVAL_LABEL[a.approval_status] || a.approval_status) + '</span>') +
      '</li>';
  }

  function deliverableItem(d) {
    var cls = d.review_status === 'APPROVED' ? 'good' : d.review_status === 'REJECTED' ? 'critical' : 'warn';
    return '<li><div class="grow"><a class="title" href="' + esc(d.file_url) + '" target="_blank" rel="noopener noreferrer">' + esc(d.file_name) + '</a> <span class="chip">v' + esc(d.version) + '</span>' +
      '<div class="meta"><a href="#/tasks?id=' + encodeURIComponent(d.task_id) + '">' + esc(d.task_name) + '</a> ・ ' + esc(d.submitted_by) + ' ・ ' + App.fmtDate(d.submitted_at, true) + '</div>' +
      (d.review_comment ? '<div class="meta">' + esc(d.review_comment) + '</div>' : '') + '</div>' +
      (d.review_status === 'PENDING' && App.canEdit()
        ? '<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="btn primary" data-dok="' + esc(d.deliverable_id) + '" data-name="' + esc(d.file_name) + '">承認</button>' +
          '<button class="btn danger" data-dng="' + esc(d.deliverable_id) + '" data-name="' + esc(d.file_name) + '">差し戻し</button></div>'
        : '<span class="chip ' + cls + '">' + esc(REVIEW_LABEL[d.review_status] || d.review_status) + '</span>') + '</li>';
  }

  App.registerView('approvals', {
    title: '成果物・承認',
    render: function (el, params) {
      var tab = params.tab || 'pending';
      return Promise.all([App.call('approvals.list', {}), App.call('deliverables.list', {})]).then(function (r) {
        var approvals = r[0], deliverables = r[1];
        var pending = approvals.filter(function (a) { return a.approval_status === 'PENDING'; });
        var reviewWaiting = deliverables.filter(function (d) { return d.review_status === 'PENDING'; });
        App.state.pendingApprovals = pending.length;
        var body;
        if (tab === 'deliverables') {
          body = '<div class="card">' + (deliverables.length ? '<ul class="list">' + deliverables.map(deliverableItem).join('') + '</ul>' : '<div class="empty-state">成果物はまだありません</div>') + '</div>';
        } else if (tab === 'history') {
          var done = approvals.filter(function (a) { return a.approval_status !== 'PENDING'; });
          body = '<div class="card">' + (done.length ? '<ul class="list">' + done.map(function (a) { return approvalItem(a, false); }).join('') + '</ul>' : '<div class="empty-state">承認履歴はありません</div>') + '</div>';
        } else {
          body = (App.isOwner() ? '' : '<div class="card muted section" style="margin-top:0;margin-bottom:12px">承認・差し戻しはオーナーのみ操作できます。</div>') +
            '<div class="card">' + (pending.length ? '<ul class="list">' + pending.map(function (a) { return approvalItem(a, true); }).join('') + '</ul>' : '<div class="empty-state">承認待ちはありません</div>') + '</div>' +
            (reviewWaiting.length ? '<div class="date-group">確認待ちの成果物 <span class="muted num">' + reviewWaiting.length + '件</span></div><div class="card"><ul class="list">' + reviewWaiting.map(deliverableItem).join('') + '</ul></div>' : '');
        }
        el.innerHTML = tabs(tab, pending.length, reviewWaiting.length) + body;
        el.querySelectorAll('[data-approve]').forEach(function (b) { b.addEventListener('click', function () { decide('approval', b.getAttribute('data-approve'), 'APPROVED', b.getAttribute('data-name')); }); });
        el.querySelectorAll('[data-reject]').forEach(function (b) { b.addEventListener('click', function () { decide('approval', b.getAttribute('data-reject'), 'REJECTED', b.getAttribute('data-name')); }); });
        el.querySelectorAll('[data-dok]').forEach(function (b) { b.addEventListener('click', function () { decide('deliverable', b.getAttribute('data-dok'), 'APPROVED', b.getAttribute('data-name')); }); });
        el.querySelectorAll('[data-dng]').forEach(function (b) { b.addEventListener('click', function () { decide('deliverable', b.getAttribute('data-dng'), 'REJECTED', b.getAttribute('data-name')); }); });
      });
    }
  });
})();
</script>

  <script>
/** D. AIエージェント管理（一覧・追加・編集・稼働状態／利用制限の切替・実行履歴） */
(function () {
  var esc = App.esc;
  var AVAIL_LABEL = { AVAILABLE: '利用可能', BUSY: '多忙', UNAVAILABLE: '利用不可', MAINTENANCE: 'メンテナンス中' };
  var LIMIT_LABEL = { OK: '制限なし', NEAR_LIMIT: '上限間近', LIMITED: '利用制限中', ERROR: 'エラー' };
  var CONN_LABEL = { INTERNAL: '内部処理', MANUAL_QUEUE: '手動キュー（指示書を手渡し）', N8N_WEBHOOK: 'n8n 連携（Phase 2）',
    OFFICIAL_API: '公式API（Phase 2）', LOCAL_LLM: 'ローカルAI（Phase 2）' };

  function stateChip(a) {
    if (a.enabled !== 'TRUE') return '<span class="chip">停止中（無効）</span>';
    if (a.usable) return '<span class="chip good">● 利用可能</span>';
    if (a.availability !== 'AVAILABLE') return '<span class="chip critical">● ' + esc(AVAIL_LABEL[a.availability] || a.availability) + '</span>';
    return '<span class="chip warn">● ' + esc(LIMIT_LABEL[a.usage_limit_status] || a.usage_limit_status) + '</span>';
  }

  function agentForm(a) {
    a = a || {};
    var en = App.state.boot.enums;
    return (a.agent_id ? '' : App.field({ name: 'agent_id', label: 'AI ID（任意）', placeholder: '例：AGT-OLLAMA（空欄なら自動採番）', hint: '「AGT-」で始まる半角英大文字・数字・ハイフン' })) +
      App.field({ name: 'agent_name', label: 'AI名', value: a.agent_name, required: true }) +
      '<div class="row2">' +
        App.field({ name: 'provider', label: '提供元', value: a.provider }) +
        App.field({ name: 'connection_type', label: '接続方式', type: 'select', value: a.connection_type || 'MANUAL_QUEUE',
          options: en.connection_type.map(function (v) { return { value: v, label: CONN_LABEL[v] || v }; }) }) +
      '</div>' +
      App.field({ name: 'role', label: '担当業務', value: a.role, placeholder: '例：デザイン・資料制作' }) +
      App.field({ name: 'capabilities', label: '能力（カンマ区切り）', value: a.capabilities, placeholder: '例：design,slides,banner',
        hint: '割り振りルールの「必要な能力」と照合されます。半角英小文字・数字・_' }) +
      '<div class="row2">' +
        App.field({ name: 'priority', label: '優先度（小さいほど優先）', type: 'number', value: a.priority || 5 }) +
        App.field({ name: 'max_concurrent_tasks', label: '同時担当上限', type: 'number', value: a.max_concurrent_tasks || 5 }) +
      '</div>' +
      App.field({ name: 'notes', label: 'メモ', type: 'textarea', value: a.notes, rows: 2 });
  }

  function openForm(a) {
    App.modal({ title: a ? 'AIエージェントを編集' : 'AIエージェントを追加', body: agentForm(a), submitLabel: a ? '保存' : '追加',
      onSubmit: function (data) {
        if (a) {
          return App.call('agents.update', { agent_id: a.agent_id, data: data, row_version: a.row_version })
            .then(function () { App.toast('保存しました'); App.render(); });
        }
        if (!data.agent_id) delete data.agent_id;
        return App.call('agents.create', { data: data }).then(function (saved) {
          App.toast('追加しました'); App.go('#/agents?id=' + encodeURIComponent(saved.agent_id));
        });
      } });
  }

  function openStatus(a) {
    var en = App.state.boot.enums;
    App.modal({ title: a.agent_name + ' の状態', submitLabel: '更新',
      body: '<div class="row2">' +
          App.field({ name: 'availability', label: '稼働状態', type: 'select', value: a.availability,
            options: en.agent_availability.map(function (v) { return { value: v, label: AVAIL_LABEL[v] || v }; }) }) +
          App.field({ name: 'usage_limit_status', label: '利用制限', type: 'select', value: a.usage_limit_status,
            options: en.usage_limit_status.map(function (v) { return { value: v, label: LIMIT_LABEL[v] || v }; }) }) +
        '</div>' +
        App.field({ name: 'notes', label: 'メモ（理由・復旧予定など）', type: 'textarea', value: a.notes, rows: 2 }) +
        '<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" name="enabled"' + (a.enabled === 'TRUE' ? ' checked' : '') + '> 有効（オフにすると割り振り対象から外れます）</label>' +
        '<div class="hint">利用不可・制限中にしても担当タスクは削除されず、「外部AIの利用待ち」として保持されます。戻すと再開候補に戻ります。</div>',
      onSubmit: function (data) {
        return App.call('agents.update', { agent_id: a.agent_id, row_version: a.row_version,
          data: { availability: data.availability, usage_limit_status: data.usage_limit_status, notes: data.notes, enabled: data.enabled } })
          .then(function () { App.toast('状態を更新しました'); App.render(); });
      } });
  }

  function renderList(el) {
    return App.call('agents.list').then(function (list) {
      if (App.canEdit()) App.setActions('<button class="btn primary" id="btn-new-agent">' + App.icon('plus') + '<span>追加</span></button>');
      el.innerHTML = '<div class="grid two">' + list.map(function (a) {
        var caps = (a.capabilities || '').split(',').filter(Boolean).map(function (c) { return '<span class="chip">' + esc(c) + '</span>'; }).join(' ');
        return '<div class="card" style="' + (a.enabled === 'TRUE' ? '' : 'opacity:.65') + '">' +
          '<div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:4px">' +
            '<a href="#/agents?id=' + encodeURIComponent(a.agent_id) + '" style="flex:1;min-width:0;font-weight:700;color:inherit;text-decoration:none;font-size:15px">' + esc(a.agent_name) + '</a>' + stateChip(a) + '</div>' +
          '<div class="muted" style="font-size:12.5px">' + esc(a.role || '') + ' ・ ' + esc(CONN_LABEL[a.connection_type] || a.connection_type) + '</div>' +
          '<div style="margin:8px 0;display:flex;gap:4px;flex-wrap:wrap">' + caps + '</div>' +
          (a.notes ? '<div class="muted" style="font-size:12px;margin-bottom:8px">メモ：' + esc(a.notes) + '</div>' : '') +
          '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
            '<span class="num" style="font-size:13px">担当中 <b>' + a.active_task_count + '</b> / 上限 ' + esc(a.max_concurrent_tasks || '-') + '</span>' +
            '<span style="flex:1"></span>' +
            (App.canEdit() ? '<button class="btn" data-status-agent="' + esc(a.agent_id) + '">状態を変更</button>' : '') +
            '<a class="btn" href="#/agents?id=' + encodeURIComponent(a.agent_id) + '">詳細</a>' +
          '</div></div>';
      }).join('') + '</div>';
      var btn = document.getElementById('btn-new-agent');
      if (btn) btn.addEventListener('click', function () { openForm(null); });
      el.querySelectorAll('[data-status-agent]').forEach(function (b) {
        b.addEventListener('click', function () {
          openStatus(list.filter(function (x) { return x.agent_id === b.getAttribute('data-status-agent'); })[0]);
        });
      });
    });
  }

  function renderDetail(el, id) {
    return App.call('agents.get', { agent_id: id }).then(function (a) {
      App.setTitle(a.agent_name);
      if (App.canEdit()) App.setActions('<button class="btn" id="btn-status">状態を変更</button><button class="btn" id="btn-edit" style="margin-left:6px">編集</button>');
      var info = [
        ['状態', stateChip(a)], ['稼働状態', esc(AVAIL_LABEL[a.availability] || a.availability)],
        ['利用制限', esc(LIMIT_LABEL[a.usage_limit_status] || a.usage_limit_status)],
        ['最終状態変更', App.fmtDate(a.last_status_changed_at, true) || '—'],
        ['提供元', esc(a.provider || '—')], ['担当業務', esc(a.role || '—')],
        ['接続方式', esc(CONN_LABEL[a.connection_type] || a.connection_type)],
        ['能力', esc((a.capabilities || '—').split(',').join(', '))], ['優先度／上限', esc((a.priority || '-') + ' ／ ' + (a.max_concurrent_tasks || '-') + '件')],
        ['メモ', esc(a.notes || '—')], ['AI ID', '<span class="muted">' + esc(a.agent_id) + '</span>']
      ].map(function (x) { return '<tr><th style="width:110px">' + x[0] + '</th><td>' + x[1] + '</td></tr>'; }).join('');
      var queue = a.queue.length ? '<ul class="list">' + a.queue.map(function (t) {
        return '<li><a class="row" href="#/tasks?id=' + encodeURIComponent(t.task_id) + '"><span class="grow"><span class="title">' + esc(t.task_name) + '</span>' +
          (t.deadline ? '<span class="meta"> ・ 期限 ' + App.fmtDate(t.deadline) + '</span>' : '') + '</span>' +
          (t.is_overdue ? '<span class="chip critical">' + App.icon('alert') + ' 超過</span>' : '') + App.statusChip(t.status) + '</a></li>';
      }).join('') + '</ul>' : '<div class="empty-state">担当中のタスクはありません</div>';
      var logs = a.executions.length ? '<div class="table-wrap"><table class="data"><thead><tr><th>開始</th><th>種別</th><th>結果</th><th>タスク</th><th>エラー</th></tr></thead><tbody>' +
        a.executions.map(function (e) {
          return '<tr><td class="num" style="white-space:nowrap">' + App.fmtDate(e.start_time, true) + '</td><td>' + esc(e.execution_type) + '</td>' +
            '<td><span class="chip ' + (e.result === 'FAILED' ? 'critical' : e.result === 'SUCCESS' ? 'good' : '') + '">' + esc(e.result || '実行中') + '</span></td>' +
            '<td>' + (e.task_id ? '<a href="#/tasks?id=' + encodeURIComponent(e.task_id) + '">開く</a>' : '—') + '</td><td>' + esc(e.error_message || '') + '</td></tr>';
        }).join('') + '</tbody></table></div>' : '<div class="empty-state">実行履歴はまだありません（自動処理の記録は STEP 8 以降に蓄積されます）</div>';
      el.innerHTML = '<p style="margin:0 0 12px"><a href="#/agents">← AIエージェント一覧</a></p>' +
        '<div class="grid two"><div class="card"><h2>基本情報</h2><table class="data">' + info + '</table></div>' +
        '<div class="card"><h2>担当中のタスク <span class="sub">' + a.active_task_count + '件</span></h2>' + queue + '</div></div>' +
        '<div class="card section"><h2>実行履歴 <span class="sub">直近50件</span></h2>' + logs + '</div>';
      var bs = document.getElementById('btn-status'); if (bs) bs.addEventListener('click', function () { openStatus(a); });
      var be = document.getElementById('btn-edit'); if (be) be.addEventListener('click', function () { openForm(a); });
    });
  }

  App.registerView('agents', {
    title: 'AIエージェント',
    render: function (el, params) { return params.id ? renderDetail(el, params.id) : renderList(el); }
  });
})();
</script>

  <script>
/** 作業待ちキュー（担当AI別）：指示書と資料の確認・コピー、着手、成果物登録への導線 */
(function () {
  var esc = App.esc;

  function showInstruction(task) {
    App.modal({ title: '指示書：' + task.task_name,
      body: '<div class="field"><label for="instruction-text">下の文章を各AIに貼り付けてください</label>' +
        '<textarea id="instruction-text" rows="14" readonly style="font-size:13px">' + esc(task.instruction_text) + '</textarea></div>',
      submitLabel: 'コピー',
      onOpen: function (form) { var ta = form.querySelector('textarea'); ta.focus(); ta.select(); },
      onSubmit: function (data, form) { return copyText(task.instruction_text, form.querySelector('textarea')); } });
  }

  /** クリップボードへコピー。使えない環境では選択状態にして手動コピーを促す */
  function copyText(text, textarea) {
    var fallback = function () {
      if (textarea) { textarea.focus(); textarea.select(); }
      try { if (document.execCommand && document.execCommand('copy')) { App.toast('コピーしました'); return; } } catch (e) { /* noop */ }
      throw { message: '自動コピーできませんでした。文章が選択された状態なので、長押し（または Ctrl+C）でコピーしてください' };
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { App.toast('指示書をコピーしました'); }).catch(function () { return fallback(); });
    }
    return Promise.resolve().then(fallback);
  }

  function taskCard(t) {
    var actions = (App.canEdit() ? '<button class="btn' + (t.has_instruction ? '' : ' primary') + '" data-write="' + esc(t.task_id) + '">' +
        (t.has_instruction ? '指示書を編集' : '指示書を書く') + '</button>' : '') +
      '<button class="btn" data-copy="' + esc(t.task_id) + '">指示書をコピー</button>' +
      '<button class="btn" data-show="' + esc(t.task_id) + '">表示</button>';
    if (App.canEdit() && t.status === 'ASSIGNED') actions += '<button class="btn primary" data-start="' + esc(t.task_id) + '">着手</button>';
    if (App.canEdit() && t.status === 'IN_PROGRESS') actions += '<a class="btn primary" href="#/tasks?id=' + encodeURIComponent(t.task_id) + '">成果物を登録</a>';
    var reason = String(t.waiting_reason || '');
    var auto = reason.indexOf('[自動] ') === 0;
    if (auto) reason = reason.slice(5);
    return '<li style="flex-wrap:wrap"><div class="grow"><a class="title" href="#/tasks?id=' + encodeURIComponent(t.task_id) + '" style="color:inherit;text-decoration:none">' + esc(t.task_name) + '</a>' +
      '<div style="display:flex;gap:4px;flex-wrap:wrap;margin:3px 0">' + App.statusChip(t.status) + App.priorityChip(t.priority) +
        (t.is_overdue ? '<span class="chip critical">' + App.icon('alert') + ' 期限超過</span>' : '') + '</div>' +
      '<div class="meta">' + esc(t.project_name) + (t.deadline ? ' ・ 期限 ' + App.fmtDate(t.deadline, true) : '') +
      (t.reference_urls.length ? ' ・ 資料 ' + t.reference_urls.length + '件' : '') + (t.has_instruction ? '' : ' ・ <a href="javascript:void(0)" data-write="' + esc(t.task_id) + '" style="color:var(--warn)">指示書未入力（ここから入力）</a>') + '</div>' +
      (reason ? '<div class="meta">理由' + (auto ? '（自動判定）' : '') + '：' + esc(reason) + '</div>' : '') + '</div>' +
      '<div class="item-actions" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">' + actions + '</div></li>';
  }

  function laneHtml(lane) {
    var c = lane.counts;
    var status = !lane.enabled ? '<span class="chip">停止中（無効）</span>' : lane.usable ? '<span class="chip good">● 利用可能</span>'
      : '<span class="chip warn" title="' + esc(lane.unusable_reason) + '">● ' + (lane.unusable_reason.indexOf('利用制限') >= 0 ? '利用制限中' : '利用不可') + '</span>';
    return '<div class="card section" id="lane-' + esc(lane.agent_id) + '"><h2>' + esc(lane.agent_name) + ' ' + status +
      '<span class="sub" style="margin-left:auto">割当 ' + c.assigned + ' ・ 作業中 ' + c.in_progress + ' ・ 待機 ' + c.waiting + ' ・ 確認中 ' + c.review + '</span></h2>' +
      (lane.tasks.length ? '<ul class="list">' + lane.tasks.map(taskCard).join('') + '</ul>' : '<div class="empty-state">キューは空です</div>') + '</div>';
  }

  App.registerView('queue', {
    title: '作業待ちキュー',
    render: function (el, params) {
      return App.call('queue.byAgent').then(function (q) {
        if (App.canEdit()) App.setActions('<button class="btn primary" id="btn-run-queue">今すぐ振り分け</button>');
        var active = params.agent || '';
        var lanes = q.lanes.filter(function (l) { return !active || l.agent_id === active; });
        var chips = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px">' +
          '<a class="chip" style="text-decoration:none;' + (!active ? 'background:var(--accent);color:var(--accent-ink)' : '') + '" href="#/queue">すべて</a>' +
          q.lanes.map(function (l) {
            var n = l.tasks.length;
            return '<a class="chip" style="text-decoration:none;' + (active === l.agent_id ? 'background:var(--accent);color:var(--accent-ink)' : '') + '" href="#/queue?agent=' + encodeURIComponent(l.agent_id) + '">' +
              esc(l.agent_name) + ' <b class="num">' + n + '</b></a>';
          }).join('') + '</div>';
        var info = '<div class="muted" style="font-size:12px">' +
          (q.last_run ? '前回の自動振り分け：' + App.fmtDate(q.last_run.time, true) + '（' + esc(q.last_run.summary || q.last_run.result) + '）' : '自動振り分けはまだ実行されていません') +
          (q.unassigned_backlog ? ' ／ 未割当のタスク ' + q.unassigned_backlog + '件' : '') + '</div>';
        el.innerHTML = chips + info + lanes.map(laneHtml).join('');

        var all = {};
        q.lanes.forEach(function (l) { l.tasks.forEach(function (t) { all[t.task_id] = t; }); });
        el.querySelectorAll('[data-copy]').forEach(function (b) {
          b.addEventListener('click', function () {
            var t = all[b.getAttribute('data-copy')];
            copyText(t.instruction_text).catch(function () { showInstruction(t); });
          });
        });
        el.querySelectorAll('[data-write]').forEach(function (b) {
          b.addEventListener('click', function (e) { e.preventDefault(); App.openInstructionEditor(all[b.getAttribute('data-write')], function () { App.render(); }); });
        });
        el.querySelectorAll('[data-show]').forEach(function (b) { b.addEventListener('click', function () { showInstruction(all[b.getAttribute('data-show')]); }); });
        el.querySelectorAll('[data-start]').forEach(function (b) {
          b.addEventListener('click', function () {
            var t = all[b.getAttribute('data-start')];
            b.disabled = true;
            App.call('tasks.changeStatus', { task_id: t.task_id, status: 'IN_PROGRESS', reason: '作業待ちキューから着手', row_version: t.row_version })
              .then(function () { App.toast('作業中にしました'); App.render(); })
              .catch(function (e) { b.disabled = false; App.showError(e); });
          });
        });
        var run = document.getElementById('btn-run-queue');
        if (run) run.addEventListener('click', function () {
          run.disabled = true;
          App.call('queue.runNow').then(function (r) {
            if (r.skipped) { App.toast(r.reason); return; }
            App.toast('振り分け完了：割当 ' + r.assigned + '件・分類 ' + r.classified + '件・待機 ' + r.waiting + '件・復旧 ' + r.recovered + '件' +
              (r.needs_classification ? '・要手動分類 ' + r.needs_classification + '件' : '') + (r.errors ? '・エラー ' + r.errors + '件' : ''));
            App.render();
          }).catch(function (e) { run.disabled = false; App.showError(e); });
        });
      });
    }
  });
})();
</script>

  <script>
/** 設定・ログ（自動処理・実行履歴・変更履歴・割り振りルール・設定値・削除済み・システム情報） */
(function () {
  var esc = App.esc;
  var TABS = [
    { key: 'automation', label: '自動処理' }, { key: 'executions', label: '実行履歴' }, { key: 'audits', label: '変更履歴' },
    { key: 'rules', label: '割り振りルール' }, { key: 'settings', label: '設定値', owner: true },
    { key: 'trash', label: '削除済み', owner: true }, { key: 'system', label: 'システム情報', owner: true }
  ];
  var EXEC_TYPE_LABEL = {
    QUEUE_CHECK: '自動振り分け', DEADLINE_CHECK: '期限確認', AUTO_ASSIGN: '自動割当', AUTO_WAIT: '利用待ちへ', AUTO_RECOVER: '自動再開',
    AUTO_CLASSIFY: '自動分類', AUTO_BLOCK: '前提待ちへ', AUTO_UNBLOCK: '前提待ち解除', AUTO_RETRY: '自動再投入', MANUAL_RETRY: '手動再実行',
    REPORT_MORNING: '朝レポート', REPORT_MIDDAY: '昼レポート', REPORT_EVENING: '夕レポート', BACKUP: 'バックアップ', EXTERNAL_EXECUTION: '外部実行'
  };
  var ACTION_LABEL = { CREATE: '登録', UPDATE: '更新', DELETE: '削除', RESTORE: '復元', STATUS_CHANGE: '状態変更', APPROVE: '承認', REJECT: '差し戻し', SETUP: 'セットアップ' };
  var FIELD_LABEL = { task_name: 'タスク名', description: '説明', category: 'カテゴリ', instruction: '指示書' };
  var ENTITY_LABEL = { Projects: 'プロジェクト', Tasks: 'タスク', Agents: 'AI', Deliverables: '成果物', Approvals: '承認', Settings: '設定', AssignmentRules: '割り振りルール', System: 'システム' };

  function resultChip(r) {
    var cls = r === 'SUCCESS' ? 'good' : r === 'FAILED' ? 'critical' : (r === 'PARTIAL' || r === 'SKIPPED') ? 'warn' : '';
    var lbl = { SUCCESS: '成功', FAILED: '失敗', PARTIAL: '一部', SKIPPED: '保留' }[r] || r || '実行中';
    return '<span class="chip ' + cls + '">' + esc(lbl) + '</span>';
  }
  function filterForm(id, fields) {
    return '<form class="card" id="' + id + '" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;padding:12px 14px;margin-bottom:12px">' +
      fields.map(function (f) { f.idPrefix = 'q_'; return App.field(f); }).join('') + '</form>';
  }
  function bindFilter(id, tab, keys) {
    var f = document.getElementById(id);
    if (!f) return;
    f.addEventListener('change', function () {
      var d = App.formData(f), q = ['tab=' + tab];
      keys.forEach(function (k) { if (d[k]) q.push(k + '=' + encodeURIComponent(d[k])); });
      location.hash = '#/settings?' + q.join('&');
    });
  }
  function opts(map, allLabel) {
    return [{ value: '', label: allLabel || 'すべて' }].concat(Object.keys(map).map(function (k) { return { value: k, label: map[k] }; }));
  }

  // ---- 自動処理 ----
  function automation(el) {
    var owner = App.isOwner();
    var p = owner ? App.call('triggers.status') : Promise.resolve(null);
    return p.then(function (st) {
      var rows = st ? st.items.map(function (i) {
        return '<tr><td><b>' + esc(i.label) + '</b><div class="muted" style="font-size:12px">' + esc(i.handler) + '</div></td><td>' + esc(i.schedule) + '</td>' +
          '<td>' + (i.installed ? '<span class="chip good">登録済み</span>' : '<span class="chip warn">未登録</span>') + (i.duplicated ? ' <span class="chip critical">重複</span>' : '') + '</td>' +
          '<td>' + (i.last_run ? App.fmtDate(i.last_run.time, true) + ' ' + resultChip(i.last_run.result) + '<div class="muted" style="font-size:12px">' + esc(i.last_run.message || '') + '</div>' : '<span class="muted">未実行</span>') + '</td></tr>';
      }).join('') : '';
      var triggerCard = st ? '<div class="card"><h2>定期処理（時間主導型トリガー）' +
          '<span class="sub">1日 約' + st.runs_per_day + '回・推定 ' + st.estimated_minutes_per_day + '分／日（Workspace 上限 360分）</span></h2>' +
          (st.all_installed ? '' : '<div class="error-box" style="margin-bottom:10px">定期処理が登録されていません。「登録・再設定」を押すと、PCを閉じていても自動処理が動くようになります。</div>') +
          '<div class="table-wrap"><table class="data"><thead><tr><th>処理</th><th>実行タイミング</th><th>状態</th><th>前回の実行</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
          '<div class="actions" style="margin-top:12px;justify-content:flex-start"><button class="btn primary" id="btn-trg-install">登録・再設定</button>' +
          '<button class="btn danger" id="btn-trg-stop">すべて停止</button></div>' +
          '<div class="hint muted" style="font-size:12px;margin-top:6px">実行間隔・時刻は「設定値」タブで変更できます（変更すると自動で再設定されます）。日次の処理は指定時刻から最大15分程度ずれることがあります。</div></div>'
        : '<div class="card muted">定期処理の登録・停止はオーナーのみ操作できます。</div>';
      var manual = '<div class="card section"><h2>手動で実行</h2><div style="display:flex;gap:8px;flex-wrap:wrap">' +
        (App.canEdit() ? '<button class="btn" data-run="queue">自動振り分け</button><button class="btn" data-run="deadline">期限確認</button>' : '') +
        (owner ? '<button class="btn" data-run="report-morning">朝レポート作成</button><button class="btn" data-run="report-midday">昼レポート作成</button>' +
          '<button class="btn" data-run="report-evening">夕レポート作成</button><button class="btn" data-run="backup">今すぐバックアップ</button>' : '') +
        '</div><div id="run-result" class="muted" style="font-size:12.5px;margin-top:10px"></div></div>';
      el.innerHTML += triggerCard + manual;

      var bi = document.getElementById('btn-trg-install');
      if (bi) bi.addEventListener('click', function () {
        App.confirmDialog('定期処理の登録', '設定どおりに6種類の定期処理を登録します（既存の登録は作り直します）。', { submitLabel: '登録する',
          action: function () { return App.call('triggers.install'); } }).then(function (r) { App.toast(r.created.length + '件の定期処理を登録しました'); App.render(); });
      });
      var bs = document.getElementById('btn-trg-stop');
      if (bs) bs.addEventListener('click', function () {
        App.confirmDialog('定期処理の停止', 'すべての定期処理を停止します。自動振り分け・期限確認・レポート・バックアップが止まります。', { submitLabel: '停止する', danger: true,
          action: function () { return App.call('triggers.uninstall'); } }).then(function (r) { App.toast(r.removed + '件の定期処理を停止しました'); App.render(); });
      });
      var RUNS = {
        queue: ['queue.runNow', {}, function (r) { return r.skipped ? r.reason : '振り分け：割当 ' + r.assigned + '・分類 ' + r.classified + '・待機 ' + r.waiting + '・復旧 ' + r.recovered + (r.retried ? '・再投入 ' + r.retried : ''); }],
        deadline: ['deadline.runNow', {}, function (r) { return r.skipped ? r.reason : '期限確認：期限超過 ' + r.overdue + '・期限間近 ' + r.due_soon + '・再調整案 ' + r.proposals + '・新規通知 ' + r.notified; }],
        'report-morning': ['reports.generate', { kind: 'morning' }, function (r) { return '朝レポートを作成しました：' + r.headline; }],
        'report-midday': ['reports.generate', { kind: 'midday' }, function (r) { return '昼レポートを作成しました：' + r.headline; }],
        'report-evening': ['reports.generate', { kind: 'evening' }, function (r) { return '夕レポートを作成しました：' + r.headline; }],
        backup: ['backup.runNow', {}, function (r) { return 'バックアップを作成しました：' + r.name + '（保持 ' + r.kept + '世代）'; }]
      };
      el.querySelectorAll('[data-run]').forEach(function (b) {
        b.addEventListener('click', function () {
          var def = RUNS[b.getAttribute('data-run')];
          b.disabled = true;
          App.call(def[0], def[1]).then(function (r) {
            var msg = def[2](r);
            document.getElementById('run-result').textContent = msg;
            App.toast(msg); b.disabled = false;
          }).catch(function (e) { b.disabled = false; App.showError(e); });
        });
      });
    });
  }

  // ---- 実行履歴 ----
  function executions(el, params) {
    var filter = { result: params.result || '', execution_type: params.execution_type || '', date: params.date || '', limit: 200 };
    return App.call('logs.executions', { filter: filter }).then(function (r) {
      el.innerHTML += filterForm('exec-filter', [
        { name: 'result', label: '結果', type: 'select', value: filter.result, options: opts({ SUCCESS: '成功', FAILED: '失敗', PARTIAL: '一部', SKIPPED: '保留' }) },
        { name: 'execution_type', label: '種別', type: 'select', value: filter.execution_type, options: opts(EXEC_TYPE_LABEL) },
        { name: 'date', label: '日付', type: 'date', value: filter.date }
      ]) + '<div class="card">' + (r.items.length ? '<div class="table-wrap"><table class="data"><thead><tr><th>開始</th><th>種別</th><th>結果</th><th>対象</th><th>内容</th><th>実行者</th></tr></thead><tbody>' +
        r.items.map(function (e) {
          return '<tr><td class="num" style="white-space:nowrap">' + App.fmtDate(e.start_time, true) + '</td><td>' + esc(EXEC_TYPE_LABEL[e.execution_type] || e.execution_type) + '</td>' +
            '<td>' + resultChip(e.result) + '</td><td>' + (e.task_id ? '<a href="#/tasks?id=' + encodeURIComponent(e.task_id) + '">' + esc(e.task_name || e.task_id) + '</a>' : esc(e.agent_id || '—')) + '</td>' +
            '<td>' + esc(e.error_message || '') + '</td><td>' + esc(e.triggered_by === 'SYSTEM' ? '自動' : String(e.triggered_by || '').split('@')[0]) + '</td></tr>';
        }).join('') + '</tbody></table></div>' : '<div class="empty-state">該当する実行履歴はありません</div>') +
        '<div class="muted" style="font-size:12px;margin-top:8px">' + r.total + '件中 ' + r.items.length + '件を表示（新しい順）</div></div>';
      bindFilter('exec-filter', 'executions', ['result', 'execution_type', 'date']);
    });
  }

  // ---- 変更履歴 ----
  function audits(el, params) {
    var filter = { entity_type: params.entity_type || '', action: params.action || '', date: params.date || '', limit: 200 };
    return App.call('logs.audits', { filter: filter }).then(function (r) {
      el.innerHTML += filterForm('audit-filter', [
        { name: 'entity_type', label: '対象', type: 'select', value: filter.entity_type, options: opts(ENTITY_LABEL) },
        { name: 'action', label: '操作', type: 'select', value: filter.action, options: opts(ACTION_LABEL) },
        { name: 'date', label: '日付', type: 'date', value: filter.date }
      ]) + '<div class="card">' + (r.items.length ? '<ul class="list">' + r.items.map(function (a, i) {
        return '<li><div class="grow"><div class="title">' + esc(a.entity_name || a.entity_id) + '</div>' +
          '<div class="meta">' + esc(ENTITY_LABEL[a.entity_type] || a.entity_type) + 'を' + esc(ACTION_LABEL[a.action] || a.action) + ' ・ ' + esc(a.user === 'SYSTEM' ? '自動処理' : a.user) + '</div></div>' +
          '<span class="meta num" style="white-space:nowrap">' + App.fmtDate(a.timestamp, true) + '</span><button class="btn" data-audit="' + i + '">詳細</button></li>';
      }).join('') + '</ul>' : '<div class="empty-state">該当する変更履歴はありません</div>') +
        '<div class="muted" style="font-size:12px;margin-top:8px">' + r.total + '件中 ' + r.items.length + '件を表示（新しい順）。変更履歴は追記のみで、編集・削除はできません。</div></div>';
      bindFilter('audit-filter', 'audits', ['entity_type', 'action', 'date']);
      el.querySelectorAll('[data-audit]').forEach(function (b) {
        b.addEventListener('click', function () {
          var a = r.items[Number(b.getAttribute('data-audit'))];
          var pretty = function (j) { try { return JSON.stringify(JSON.parse(j), null, 2); } catch (e) { return j || '（なし）'; } };
          App.modal({ title: '変更履歴の詳細', body:
            '<div class="muted" style="font-size:12px">' + esc(a.timestamp) + ' ・ ' + esc(a.user) + ' ・ ' + esc(a.entity_type) + ' ' + esc(a.entity_id) + '</div>' +
            '<div class="field"><label>変更前</label><pre class="report-text" style="max-height:220px">' + esc(pretty(a.before_json)) + '</pre></div>' +
            '<div class="field"><label>変更後</label><pre class="report-text" style="max-height:220px">' + esc(pretty(a.after_json)) + '</pre></div>' });
        });
      });
    });
  }

  // ---- 割り振りルール ----
  function ruleForm(r, agents) {
    r = r || {};
    return '<div class="row2">' + App.field({ name: 'priority', label: '優先順位（小さいほど先に判定）', type: 'number', value: r.priority || 50, required: true }) +
        App.field({ name: 'required_capability', label: '必要な能力', value: r.required_capability, required: true, placeholder: '例：design' }) + '</div>' +
      App.field({ name: 'keyword_pattern', label: 'キーワード（「|」区切りで複数）', value: r.keyword_pattern, required: true, placeholder: '例：デザイン|バナー|チラシ' }) +
      '<div class="row2">' + App.field({ name: 'category', label: 'カテゴリ', value: r.category, placeholder: '空欄なら能力と同じ' }) +
        App.field({ name: 'preferred_agent_id', label: '推奨AI', type: 'select', value: r.preferred_agent_id,
          options: [{ value: '', label: '指定なし（能力で選ぶ）' }].concat(agents.map(function (a) { return { value: a.agent_id, label: a.agent_name }; })) }) + '</div>' +
      App.field({ name: 'match_field', label: '照合する項目', type: 'select', multiple: true, value: r.match_field || 'task_name,description,category',
        options: [{ value: 'task_name', label: 'タスク名' }, { value: 'description', label: '説明' }, { value: 'category', label: 'カテゴリ' }, { value: 'instruction', label: '指示書' }] }) +
      '<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" name="enabled"' + (r.enabled === 'FALSE' ? '' : ' checked') + '> 有効</label>';
  }
  function rules(el) {
    return Promise.all([App.call('rules.list'), App.call('agents.list')]).then(function (res) {
      var list = res[0], agents = res[1];
      var owner = App.isOwner();
      el.innerHTML += '<div class="card"><h2>割り振りルール <span class="sub">上から順に判定し、最初に一致したルールで分類します</span>' +
        (owner ? '<button class="btn primary" style="margin-left:auto" id="btn-rule-new">' + App.icon('plus') + '<span>追加</span></button>' : '') + '</h2>' +
        '<div class="table-wrap"><table class="data"><thead><tr><th>順位</th><th>キーワード</th><th>能力 → 推奨AI</th><th>状態</th>' + (owner ? '<th></th>' : '') + '</tr></thead><tbody>' +
        list.map(function (r) {
          return '<tr style="' + (r.enabled === 'FALSE' ? 'opacity:.55' : '') + '"><td class="num">' + esc(r.priority) + '</td><td class="wrap-any">' + esc(r.keyword_pattern.split('|').join(' | ')) + '<div class="muted" style="font-size:11.5px">照合：' +
            esc(String(r.match_field).split(',').map(function (f) { return FIELD_LABEL[f] || f; }).join('・')) + '</div></td>' +
            '<td>' + esc(r.required_capability) + ' → ' + esc(r.preferred_agent_name || '（能力で選ぶ）') + '</td>' +
            '<td>' + (r.enabled === 'FALSE' ? '<span class="chip">無効</span>' : '<span class="chip good">有効</span>') + '</td>' +
            (owner ? '<td><button class="btn" data-rule="' + esc(r.rule_id) + '">編集</button></td>' : '') + '</tr>';
        }).join('') + '</tbody></table></div></div>' +
        '<div class="card section"><h2>試し判定 <span class="sub">タスク名を入れると、どのAIに割り振られるか確認できます</span></h2>' +
        '<form id="rule-test" class="form"><div class="row2">' + App.field({ idPrefix: 't_', name: 'task_name', label: 'タスク名', placeholder: '例：年末セールのバナー作成' }) +
        App.field({ idPrefix: 't_', name: 'description', label: '説明（任意）' }) + '</div>' +
        '<div class="actions" style="justify-content:flex-start"><button class="btn" type="submit">判定する</button></div></form><div id="rule-test-result" style="margin-top:8px"></div></div>';

      var open = function (r) {
        App.modal({ title: r ? 'ルールを編集' : 'ルールを追加', body: ruleForm(r, agents),
          onSubmit: function (data) {
            var call = r ? App.call('rules.update', { rule_id: r.rule_id, data: data }) : App.call('rules.create', { data: data });
            return call.then(function () { App.toast('保存しました'); App.render(); });
          } });
      };
      var nb = document.getElementById('btn-rule-new'); if (nb) nb.addEventListener('click', function () { open(null); });
      el.querySelectorAll('[data-rule]').forEach(function (b) {
        b.addEventListener('click', function () { open(list.filter(function (x) { return x.rule_id === b.getAttribute('data-rule'); })[0]); });
      });
      document.getElementById('rule-test').addEventListener('submit', function (e) {
        e.preventDefault();
        App.call('rules.test', { data: App.formData(e.target) }).then(function (r) {
          var c = r.classification, d = r.decision;
          var DEC = { ASSIGN: '割り当て', WAIT: '利用待ち', HOLD: '上限のため保留', NO_CANDIDATE: '候補なし' };
          document.getElementById('rule-test-result').innerHTML = !c.source
            ? '<div class="error-box">どのルールにも一致しません。担当AIを手動で設定するか、ルールを追加してください。</div>'
            : '<div class="report-text">一致したルール：' + esc(c.rule_id || '（手動指定）') + '\n必要な能力：' + esc(c.required_capability) +
              '\n判定：' + esc(DEC[d.decision] || d.decision) + (r.agent_name ? ' → ' + esc(r.agent_name) : '') + '\n理由：' + esc(d.reason) + '</div>';
        }).catch(App.showError);
      });
    });
  }

  // ---- 設定値 ----
  function settings(el) {
    return App.call('settings.list').then(function (list) {
      el.innerHTML += '<div class="card"><div class="table-wrap"><table class="data"><thead><tr><th>項目</th><th>値</th><th>説明</th><th></th></tr></thead><tbody>' +
        list.map(function (s) {
          return '<tr><td style="white-space:nowrap"><code>' + esc(s.setting_key) + '</code></td><td class="num"><b>' + esc(s.setting_value || '（空）') + '</b></td>' +
            '<td class="muted" style="font-size:12.5px">' + esc(s.description) + '</td>' +
            '<td>' + (s.readonly ? '<span class="chip">変更不可</span>' : '<button class="btn" data-key="' + esc(s.setting_key) + '">変更</button>') + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
      el.querySelectorAll('[data-key]').forEach(function (b) {
        b.addEventListener('click', function () {
          var s = list.filter(function (x) { return x.setting_key === b.getAttribute('data-key'); })[0];
          App.modal({ title: s.setting_key + ' を変更', body: '<p class="muted" style="margin:0">' + esc(s.description) + '</p>' +
            App.field({ name: 'value', label: '値', value: s.setting_value, type: s.setting_key === 'ALLOWED_USERS' || s.setting_key === 'APPROVAL_REQUIRED_ACTIONS' ? 'textarea' : 'text', rows: 3 }),
            onSubmit: function (d) {
              return App.call('settings.update', { key: s.setting_key, value: d.value }).then(function (r) {
                App.toast(r.triggers_reinstalled ? '保存し、定期処理を再設定しました' : '保存しました'); App.render();
              });
            } });
        });
      });
    });
  }

  // ---- 削除済み ----
  function trash(el) {
    return App.call('trash.list').then(function (t) {
      var row = function (kind, id, name, meta) {
        return '<li><div class="grow"><div class="title">' + esc(name) + '</div><div class="meta">' + meta + '</div></div>' +
          '<button class="btn" data-restore-' + kind + '="' + esc(id) + '">復元</button></li>';
      };
      el.innerHTML += '<div class="card"><h2>削除済みプロジェクト <span class="sub">' + t.projects.length + '件</span></h2>' +
        (t.projects.length ? '<ul class="list">' + t.projects.map(function (p) { return row('project', p.project_id, p.project_name, '削除 ' + App.fmtDate(p.updated_at, true) + ' ・ 配下タスクも一緒に復元します'); }).join('') + '</ul>' : '<div class="empty-state">なし</div>') + '</div>' +
        '<div class="card section"><h2>削除済みタスク <span class="sub">' + t.tasks.length + '件</span></h2>' +
        (t.tasks.length ? '<ul class="list">' + t.tasks.map(function (x) { return row('task', x.task_id, x.task_name, esc(x.project_name) + ' ・ 削除 ' + App.fmtDate(x.updated_at, true)); }).join('') + '</ul>' : '<div class="empty-state">なし</div>') +
        '<div class="muted" style="font-size:12px;margin-top:8px">削除したデータは行として保持されています。依存関係は復元されないため、必要なら再設定してください。</div></div>';
      el.querySelectorAll('[data-restore-project]').forEach(function (b) {
        b.addEventListener('click', function () {
          App.call('projects.restore', { project_id: b.getAttribute('data-restore-project') })
            .then(function (r) { App.toast('復元しました（タスク ' + r.restored_tasks + '件）'); App.render(); }).catch(App.showError);
        });
      });
      el.querySelectorAll('[data-restore-task]').forEach(function (b) {
        b.addEventListener('click', function () {
          App.call('tasks.restore', { task_id: b.getAttribute('data-restore-task') })
            .then(function () { App.toast('復元しました'); App.render(); }).catch(App.showError);
        });
      });
    });
  }

  // ---- システム情報 ----
  function system(el) {
    return App.call('system.health').then(function (h) {
      el.innerHTML += '<div class="grid two"><div class="card"><h2>データの保存場所</h2><table class="data">' +
        '<tr><th>データベース</th><td>' + (h.spreadsheet_url ? '<a href="' + esc(h.spreadsheet_url) + '" target="_blank" rel="noopener noreferrer">スプレッドシートを開く</a>' : '—') + '</td></tr>' +
        '<tr><th>バックアップ</th><td>' + (h.backup_folder_url ? '<a href="' + esc(h.backup_folder_url) + '" target="_blank" rel="noopener noreferrer">フォルダを開く</a>' : '—') +
          '<div class="muted" style="font-size:12px">最終 ' + (h.last_backup ? App.fmtDate(h.last_backup, true) : '未実行') + '</div></td></tr>' +
        '<tr><th>オーナー</th><td>' + esc(h.owner_email) + '</td></tr><tr><th>バージョン</th><td>' + esc(h.version) + '</td></tr>' +
        '<tr><th>直近24時間のエラー</th><td>' + (h.errors_24h ? '<a href="#/settings?tab=executions&result=FAILED" class="chip critical" style="text-decoration:none">' + h.errors_24h + '件</a>' : '<span class="chip good">0件</span>') + '</td></tr>' +
        '</table></div>' +
        '<div class="card"><h2>データ量 <span class="sub">スプレッドシートのセル上限（1,000万）に対して ' + h.cell_usage_percent + '%</span></h2>' + App.progressBar(Math.min(100, Math.max(1, h.cell_usage_percent))) +
        '<table class="data" style="margin-top:10px"><thead><tr><th>シート</th><th style="text-align:right">行数</th></tr></thead><tbody>' +
        h.sheets.map(function (s) { return '<tr><td>' + esc(s.name) + '</td><td class="num" style="text-align:right">' + s.rows + '</td></tr>'; }).join('') + '</tbody></table></div></div>' +
        '<div class="card section"><h2>導入確認（自己診断）<span class="sub">データを書き換えずに設置状態を点検します</span>' +
        '<button class="btn" style="margin-left:auto" id="btn-selfcheck">点検する</button></h2><div id="selfcheck-result"></div></div>';
      document.getElementById('btn-selfcheck').addEventListener('click', function (e) {
        var b = e.currentTarget; b.disabled = true;
        App.call('system.selfCheck').then(function (r) {
          b.disabled = false;
          var cls = { OK: 'good', WARN: 'warn', NG: 'critical' };
          var lbl = { OK: '問題なし', WARN: '注意', NG: '要対応' };
          document.getElementById('selfcheck-result').innerHTML =
            '<div style="margin-bottom:8px">総合判定：<span class="chip ' + cls[r.overall] + '">' + lbl[r.overall] + '</span></div><ul class="list">' +
            r.items.map(function (i) {
              return '<li><span class="chip ' + cls[i.status] + '" style="min-width:64px;justify-content:center">' + lbl[i.status] + '</span>' +
                '<div class="grow"><div class="title">' + esc(i.name) + '</div><div class="meta">' + esc(i.detail) + '</div></div></li>';
            }).join('') + '</ul>';
        }).catch(function (err) { b.disabled = false; App.showError(err); });
      });
    });
  }

  var RENDER = { automation: automation, executions: executions, audits: audits, rules: rules, settings: settings, trash: trash, system: system };

  App.registerView('settings', {
    title: '設定・ログ',
    render: function (el, params) {
      var tabs = TABS.filter(function (t) { return !t.owner || App.isOwner(); });
      var tab = params.tab && tabs.some(function (t) { return t.key === params.tab; }) ? params.tab : 'automation';
      el.innerHTML = '<nav class="tabs">' + tabs.map(function (t) {
        return '<a href="#/settings?tab=' + t.key + '" class="' + (t.key === tab ? 'active' : '') + '">' + esc(t.label) + '</a>';
      }).join('') + '</nav>';
      return RENDER[tab](el, params);
    }
  });
})();
</script>

  <script>
/** 共通画面：スマホ用メニュー、通知、未実装画面の仮表示 */
(function () {
  var esc = App.esc;

  App.registerView('menu', {
    title: 'メニュー',
    render: function (el) {
      el.innerHTML = '<div class="card"><ul class="list">' + App.NAV.map(function (n) {
        return '<li><a class="row" href="#/' + n.route + '" style="align-items:center;min-height:48px"><span style="width:22px;display:inline-flex">' + App.icon(n.icon) + '</span>' +
          '<span class="grow title">' + esc(n.label) + '</span></a></li>';
      }).join('') + '</ul></div>' +
      '<p class="muted" style="font-size:12px;margin-top:12px">' + esc(App.state.boot.user.email) + '（' + esc(App.state.boot.user.role) + '）／v' + esc(App.state.boot.version) + '</p>';
    }
  });

  App.registerView('notifications', {
    title: '通知',
    render: function (el) {
      return App.call('notifications.list', { limit: 100 }).then(function (list) {
        var unread = list.filter(function (n) { return n.read_status === 'UNREAD'; });
        App.setActions(unread.length ? '<button class="btn" id="btn-read-all">すべて既読</button>' : '');
        el.innerHTML = '<div class="card">' + (list.length ? '<ul class="list">' + list.map(function (n) {
          var cls = n.severity === 'CRITICAL' ? 'critical' : n.severity === 'WARN' ? 'warn' : '';
          return '<li style="' + (n.read_status === 'UNREAD' ? '' : 'opacity:.6') + '"><div class="grow"><div class="title">' + esc(n.message) + '</div>' +
            '<div class="meta">' + App.fmtDate(n.created_at, true) + ' ・ ' + esc(n.notification_type) +
            (n.task_id ? ' ・ <a href="#/tasks?id=' + encodeURIComponent(n.task_id) + '">タスクを開く</a>' : '') + '</div></div>' +
            (cls ? '<span class="chip ' + cls + '">' + (cls === 'critical' ? '重要' : '注意') + '</span>' : '') + '</li>';
        }).join('') + '</ul>' : '<div class="empty-state">通知はありません</div>') + '</div>';
        var btn = document.getElementById('btn-read-all');
        if (btn) btn.addEventListener('click', function () {
          App.call('notifications.markRead', { ids: unread.map(function (n) { return n.notification_id; }).join(',') })
            .then(function () { App.state.unread = 0; App.toast('既読にしました'); App.render(); })
            .catch(App.showError);
        });
      });
    }
  });

  var PLANNED = {
    projects: ['プロジェクト', 'STEP 5'], tasks: ['タスク', 'STEP 5'], queue: ['作業待ちキュー', 'STEP 7'],
    agents: ['AIエージェント', 'STEP 6'], schedule: ['スケジュール', 'STEP 5'], approvals: ['成果物・承認', 'STEP 5'],
    settings: ['設定・ログ', 'STEP 9']
  };
  Object.keys(PLANNED).forEach(function (route) {
    if (App.state.views[route]) return; // 実装済みの画面は上書きしない
    App.registerView(route, {
      title: PLANNED[route][0],
      placeholder: true,
      render: function (el) {
        el.innerHTML = '<div class="card placeholder">「' + esc(PLANNED[route][0]) + '」画面は ' + esc(PLANNED[route][1]) + ' で実装します。</div>';
      }
    });
  });

  App.registerView('notfound', {
    title: 'ページが見つかりません',
    render: function (el) { el.innerHTML = '<div class="card placeholder">ページが見つかりません。<a href="#/dashboard">ダッシュボードへ</a></div>'; }
  });
})();
</script>

  <script>App.start();</script>
</body>
