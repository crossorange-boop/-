<style>
:root {
  color-scheme: light;
  --bg: #f4f4f1;
  --surface: #fcfcfb;
  --surface-2: #efeee9;
  --border: #dddcd5;
  --text: #0b0b0b;
  --text-2: #52514e;
  --text-3: #75746f;
  --accent: #1c5cab;
  --accent-ink: #ffffff;
  --accent-soft: #cde2fb;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --good: #0f7a3a;
  --warn: #9a6400;
  --critical: #c22b2b;
  --critical-soft: #fde8e8;
  --warn-soft: #fff3d6;
  --good-soft: #e3f4ea;
  --nav-bg: #14243b;
  --nav-text: #d7dee9;
  --nav-active: #ffffff;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
  --radius: 10px;
  --font: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111110;
    --surface: #1a1a19;
    --surface-2: #242422;
    --border: #34332f;
    --text: #f0efec;
    --text-2: #c3c2b7;
    --text-3: #9a998f;
    --accent: #5598e7;
    --accent-ink: #0b0b0b;
    --accent-soft: #1c3557;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --good: #4cc27a;
    --warn: #e5b23c;
    --critical: #f07070;
    --critical-soft: #3a1c1c;
    --warn-soft: #3a2f14;
    --good-soft: #163222;
    --nav-bg: #0c1522;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --surface-2: #242422; --border: #34332f;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #9a998f;
  --accent: #5598e7; --accent-ink: #0b0b0b; --accent-soft: #1c3557;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --good: #4cc27a; --warn: #e5b23c; --critical: #f07070;
  --critical-soft: #3a1c1c; --warn-soft: #3a2f14; --good-soft: #163222;
  --nav-bg: #0c1522; --shadow: none;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

/* レイアウト */
.app { display: flex; min-height: 100vh; }
.sidebar { width: 220px; flex-shrink: 0; background: var(--nav-bg); color: var(--nav-text); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
.brand { padding: 18px 18px 14px; font-weight: 700; font-size: 15px; color: #fff; letter-spacing: .02em; }
.brand small { display: block; font-weight: 400; font-size: 11px; color: var(--nav-text); opacity: .75; }
.nav { list-style: none; margin: 0; padding: 4px 8px; flex: 1; overflow-y: auto; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--nav-text); text-decoration: none; font-size: 13.5px; }
.nav a:hover { background: rgba(255,255,255,.07); }
.nav a.active { background: rgba(255,255,255,.14); color: var(--nav-active); font-weight: 600; }
.nav svg { width: 18px; height: 18px; flex-shrink: 0; }
.nav .badge { margin-left: auto; }
.sidebar-foot { padding: 12px 18px; font-size: 11px; opacity: .7; word-break: break-all; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 12px 24px; }
.topbar h1 { font-size: 18px; margin: 0; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.content { padding: 20px 24px 40px; max-width: 1280px; width: 100%; }

.bottom-nav { display: none; }

/* 部品 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); padding: 7px 14px; border-radius: 8px; cursor: pointer; min-height: 36px; text-decoration: none; color: var(--text); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--critical); }
.btn.icon { padding: 6px; width: 36px; }
.btn svg { width: 18px; height: 18px; }
.btn:disabled { opacity: .5; cursor: default; }

.badge { display: inline-flex; align-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 11.5px; font-weight: 700; background: var(--critical); color: #fff; justify-content: center; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.chip.critical { background: var(--critical-soft); color: var(--critical); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip svg { width: 12px; height: 12px; }

.grid { display: grid; gap: 16px; }
.grid.kpi { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; }
.card h2 { font-size: 14px; margin: 0 0 12px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card h2 .sub { font-weight: 400; color: var(--text-3); font-size: 12px; }
.section { margin-top: 16px; }

.kpi-tile { display: block; text-decoration: none; color: inherit; }
.kpi-tile .label { font-size: 12.5px; color: var(--text-2); }
.kpi-tile .value { font-size: 28px; font-weight: 700; line-height: 1.2; margin-top: 4px; }
.kpi-tile .note { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.kpi-tile.alert .value { color: var(--critical); }
a.kpi-tile:hover { border-color: var(--accent); }

/* 積み上げ棒（タスク状態） */
.stack { display: flex; gap: 2px; height: 14px; margin: 4px 0 12px; }
.stack .seg { min-width: 4px; height: 100%; }
.stack .seg:first-child { border-radius: 4px 0 0 4px; }
.stack .seg:last-child { border-radius: 0 4px 4px 0; }
.stack .seg:only-child { border-radius: 4px; }
.stack.empty { background: var(--surface-2); border-radius: 4px; }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px 16px; }
.legend-item { display: flex; align-items: baseline; gap: 8px; font-size: 13px; color: var(--text-2); }
.legend-item .swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; transform: translateY(1px); }
.legend-item .v { margin-left: auto; color: var(--text); font-weight: 600; }
.legend-item .detail { display: block; font-size: 11.5px; color: var(--text-3); }

/* 横棒（AI別） */
.hbar { display: grid; grid-template-columns: minmax(120px, 190px) 1fr 36px; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; }
.hbar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.hbar .track { height: 10px; position: relative; }
.hbar .fill { height: 100%; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 2px; }
.hbar .v { text-align: right; font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
.dot.ok { background: var(--good); }
.dot.ng { background: var(--critical); }

/* リスト */
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 9px 0; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; }
.list li:first-child { border-top: 0; }
.list .grow { flex: 1; min-width: 0; }
.list .title { font-weight: 600; overflow-wrap: anywhere; }
.list .meta { font-size: 12px; color: var(--text-3); overflow-wrap: anywhere; }
.list a.row { text-decoration: none; color: inherit; display: flex; gap: 10px; flex: 1; min-width: 0; }
.empty-state { color: var(--text-3); font-size: 13px; padding: 8px 0; }

/* 表 */
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th { text-align: left; font-weight: 600; color: var(--text-2); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.data td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; }
table.data tr:hover td { background: var(--surface-2); }

/* フォーム */
.form { display: grid; gap: 12px; }
.form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field label { display: block; font-size: 12.5px; color: var(--text-2); margin-bottom: 4px; font-weight: 600; }
.field input, .field select, .field textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); min-height: 38px; }
.field textarea { min-height: 90px; resize: vertical; }
.field .hint { font-size: 11.5px; color: var(--text-3); margin-top: 3px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* モーダル */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 12px; width: 100%; max-width: 620px; max-height: calc(100vh - 32px); overflow-y: auto; padding: 20px; }
.modal h3 { margin: 0 0 14px; font-size: 16px; }

/* トースト */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 16px; border-radius: 8px; z-index: 60; font-size: 13px; max-width: calc(100vw - 32px); box-shadow: 0 4px 16px rgba(0,0,0,.25); }
.toast.error { background: var(--critical); }

.loading { padding: 40px 0; text-align: center; color: var(--text-3); }
.error-box { background: var(--critical-soft); color: var(--critical); padding: 12px 14px; border-radius: 8px; }
.placeholder { padding: 32px; text-align: center; color: var(--text-3); }
.muted { color: var(--text-3); }
.sp-only { display: none; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 14px; overflow-x: auto; }
.tabs a { padding: 8px 14px; text-decoration: none; color: var(--text-2); border-bottom: 2px solid transparent; white-space: nowrap; font-size: 13.5px; }
.tabs a.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
.date-group { font-size: 12.5px; font-weight: 700; color: var(--text-2); margin: 18px 0 6px; display: flex; align-items: center; gap: 8px; }
.date-group.critical { color: var(--critical); }
.gantt { flex-basis: 100%; position: relative; height: 8px; background: var(--surface-2); border-radius: 4px; margin-top: 6px; }
.gantt .bar { position: absolute; top: 0; height: 100%; border-radius: 4px; background: var(--series-1); min-width: 6px; }
.gantt .bar.over { background: var(--critical); }
.gantt .today { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: .6; }
.tooltip { position: fixed; z-index: 70; pointer-events: none; background: var(--text); color: var(--surface); font-size: 12px; padding: 6px 9px; border-radius: 6px; max-width: 240px; }

/* スマートフォン */
@media (max-width: 860px) {
  .sidebar { display: none; }
  .topbar { padding: 10px 16px; }
  .topbar h1 { font-size: 16px; }
  .content { padding: 14px 16px calc(84px + env(safe-area-inset-bottom)); }
  .grid.kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .grid.two { grid-template-columns: minmax(0, 1fr); }
  .card { padding: 14px; }
  .kpi-tile .value { font-size: 24px; }
  .form .row2 { grid-template-columns: 1fr; }
  .pc-only { display: none; }
  .sp-only { display: block; }
  form.card[id$="-filter"] { grid-template-columns: 1fr 1fr !important; gap: 8px !important; }
  form.card[id$="-filter"] .field label { font-size: 11.5px; margin-bottom: 2px; }
  .bottom-nav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--border); padding: 4px 4px env(safe-area-inset-bottom); }
  .bottom-nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; font-size: 10.5px; color: var(--text-2); text-decoration: none; position: relative; min-height: 52px; justify-content: center; }
  .bottom-nav a.active { color: var(--accent); font-weight: 700; }
  .bottom-nav svg { width: 22px; height: 22px; }
  .bottom-nav .badge { position: absolute; top: 2px; right: calc(50% - 22px); height: 16px; min-width: 16px; font-size: 10px; padding: 0 4px; }
  .modal-backdrop { align-items: flex-end; padding: 0; }
  .modal { border-radius: 14px 14px 0 0; max-height: 92vh; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
}
</style>
