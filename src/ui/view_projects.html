<script>
/** B. プロジェクト管理（一覧・詳細・登録・編集・削除依頼） */
(function () {
  var esc = App.esc;
  var STATUS_LABEL = { PLANNING: '計画中', ACTIVE: '進行中', ON_HOLD: '保留', COMPLETED: '完了', CANCELLED: '中止' };

  function projectForm(p) {
    p = p || {};
    var en = App.state.boot.enums;
    return App.field({ name: 'project_name', label: 'プロジェクト名', value: p.project_name, required: true }) +
      App.field({ name: 'goal', label: '目標', value: p.goal, placeholder: '例：12月中に新サイトを公開' }) +
      App.field({ name: 'description', label: '説明', type: 'textarea', value: p.description, rows: 3 }) +
      '<div class="row2">' +
        App.field({ name: 'priority', label: '優先度', type: 'select', value: p.priority || 'MEDIUM',
          options: en.priority.map(function (v) { return { value: v, label: App.PRIORITY_LABEL[v] }; }) }) +
        App.field({ name: 'status', label: '状態', type: 'select', value: p.status || 'PLANNING',
          options: en.project_status.map(function (v) { return { value: v, label: STATUS_LABEL[v] || v }; }) }) +
      '</div><div class="row2">' +
        App.field({ name: 'start_date', label: '開始日', type: 'date', value: p.start_date }) +
        App.field({ name: 'deadline', label: '期限', type: 'date', value: p.deadline }) +
      '</div>';
  }

  function openCreate() {
    App.modal({ title: 'プロジェクトを登録', body: projectForm(), submitLabel: '登録',
      onSubmit: function (data) {
        return App.call('projects.create', { data: data }).then(function (p) {
          App.toast('登録しました'); App.go('#/projects?id=' + encodeURIComponent(p.project_id));
        });
      } });
  }

  function openEdit(p) {
    App.modal({ title: 'プロジェクトを編集', body: projectForm(p),
      onSubmit: function (data) {
        return App.call('projects.update', { project_id: p.project_id, data: data, row_version: p.row_version })
          .then(function () { App.toast('保存しました'); App.render(); });
      } });
  }

  function requestDelete(p) {
    App.confirmDialog('プロジェクトの削除',
      '「' + p.project_name + '」と配下のタスクを削除します。削除は承認後に実行され、データは履歴として保持されます。',
      { reason: true, reasonLabel: '削除の理由', submitLabel: '削除を依頼', danger: true,
        action: function (d) { return App.call('projects.requestDelete', { project_id: p.project_id, comment: d.reason }); } })
      .then(function (r) {
        App.toast(r.status === 'APPROVAL_REQUESTED' ? '削除の承認依頼を作成しました（承認後に削除されます）' : '削除しました');
        App.go(r.status === 'DELETED' ? '#/projects' : '#/approvals');
      });
  }

  function renderList(el) {
    return App.call('projects.list').then(function (list) {
      if (App.canEdit()) App.setActions('<button class="btn primary" id="btn-new-project">' + App.icon('plus') + '<span>新規</span></button>');
      var cards = list.map(function (p) {
        return '<a class="card" style="display:block;text-decoration:none;color:inherit" href="#/projects?id=' + encodeURIComponent(p.project_id) + '">' +
          '<div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:6px">' +
            '<div style="flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere">' + esc(p.project_name) + '</div>' +
            App.priorityChip(p.priority) + '<span class="chip">' + esc(STATUS_LABEL[p.status] || p.status) + '</span></div>' +
          (p.goal ? '<div class="muted" style="font-size:12.5px;margin-bottom:8px">目標：' + esc(p.goal) + '</div>' : '') +
          App.progressBar(p.progress) +
          '<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:6px" class="muted">' +
            '<span class="num">進捗 ' + p.progress + '%（' + p.completed_count + '/' + p.task_count + '）</span>' +
            (p.deadline ? '<span>期限 ' + App.fmtDate(p.deadline) + '</span>' : '') +
            (p.overdue_count ? '<span class="chip critical">' + App.icon('alert') + ' 期限超過 ' + p.overdue_count + '</span>' : '') +
            (p.is_overdue ? '<span class="chip critical">プロジェクト期限超過</span>' : '') +
          '</div></a>';
      }).join('');
      el.innerHTML = list.length ? '<div class="grid two">' + cards + '</div>'
        : '<div class="card placeholder">プロジェクトはまだありません。' + (App.canEdit() ? '右上の「新規」から登録してください。' : '') + '</div>';
      var btn = document.getElementById('btn-new-project');
      if (btn) btn.addEventListener('click', openCreate);
    });
  }

  function renderDetail(el, id) {
    return App.call('projects.get', { project_id: id }).then(function (p) {
      App.setTitle(p.project_name);
      if (App.canEdit()) {
        App.setActions('<button class="btn" id="btn-edit">編集</button>');
      }
      var rows = [
        ['状態', esc(STATUS_LABEL[p.status] || p.status)], ['優先度', App.priorityChip(p.priority)],
        ['目標', esc(p.goal || '-')], ['開始日', App.fmtDate(p.start_date) || '-'], ['期限', App.fmtDate(p.deadline) || '-'],
        ['説明', esc(p.description || '-').replace(/\n/g, '<br>')]
      ].map(function (r) { return '<tr><th style="width:90px">' + r[0] + '</th><td>' + r[1] + '</td></tr>'; }).join('');
      var tasks = p.tasks.map(function (t) {
        return '<li><a class="row" href="#/tasks?id=' + encodeURIComponent(t.task_id) + '"><div class="grow">' +
          '<div class="title">' + esc(t.task_name) + '</div><div class="meta">' + esc(t.assigned_agent_id || '担当未設定') +
          (t.deadline ? ' ・ 期限 ' + App.fmtDate(t.deadline) : '') + '</div></div>' +
          (t.is_overdue ? '<span class="chip critical">' + App.icon('alert') + ' 超過</span>' : '') + App.statusChip(t.status) + '</a></li>';
      }).join('');
      el.innerHTML =
        '<p style="margin:0 0 12px"><a href="#/projects">← プロジェクト一覧</a></p>' +
        '<div class="grid two">' +
          '<div class="card"><h2>概要</h2><table class="data">' + rows + '</table></div>' +
          '<div class="card"><h2>進捗</h2>' + App.progressBar(p.progress) +
            '<div class="grid kpi" style="margin-top:12px;grid-template-columns:repeat(3,1fr)">' +
              '<div><div class="muted" style="font-size:12px">完了率</div><div class="num" style="font-size:22px;font-weight:700">' + p.progress + '%</div></div>' +
              '<div><div class="muted" style="font-size:12px">タスク</div><div class="num" style="font-size:22px;font-weight:700">' + p.completed_count + '/' + p.task_count + '</div></div>' +
              '<div><div class="muted" style="font-size:12px">期限超過</div><div class="num" style="font-size:22px;font-weight:700;' + (p.overdue_count ? 'color:var(--critical)' : '') + '">' + p.overdue_count + '</div></div>' +
            '</div>' +
            (App.canEdit() ? '<div class="actions" style="margin-top:16px;justify-content:flex-start"><button class="btn danger" id="btn-delete">削除を依頼</button></div>' : '') +
          '</div>' +
        '</div>' +
        '<div class="card section"><h2>タスク一覧 <span class="sub">' + p.tasks.length + '件</span>' +
          (App.canEdit() ? '<a class="btn" style="margin-left:auto" href="#/tasks?new=1&project_id=' + encodeURIComponent(p.project_id) + '">' + App.icon('plus') + '<span>タスク追加</span></a>' : '') +
        '</h2>' + (tasks ? '<ul class="list">' + tasks + '</ul>' : '<div class="empty-state">タスクはまだありません</div>') + '</div>';
      var e1 = document.getElementById('btn-edit'); if (e1) e1.addEventListener('click', function () { openEdit(p); });
      var e2 = document.getElementById('btn-delete'); if (e2) e2.addEventListener('click', function () { requestDelete(p); });
    });
  }

  App.registerView('projects', {
    title: 'プロジェクト',
    render: function (el, params) { return params.id ? renderDetail(el, params.id) : renderList(el); }
  });
})();
</script>
